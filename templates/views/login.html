<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keisy Medical | Acceso</title>
    <link rel="icon" href="data:,">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #044b99;
            --bg-dark: #0f172a;
        }
        body { background-color: var(--bg-dark); height: 100vh; display: flex; align-items: center; justify-content: center; font-family: system-ui, sans-serif; }
        .login-card { background: white; border-radius: 16px; padding: 3rem; width: 100%; max-width: 400px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.3); }
        .app-icon { width: 48px; height: 48px; margin-bottom: 1.5rem; }
    </style>
</head>
<body>
    <div class="login-card text-center">
        <img src="C:\Users\DESKTOP\Desktop\keisy\templates\assets\keisy.png" alt="Icon" class="app-icon">
        <h4 class="fw-bold mb-1">Keisy Medical</h4>
        <p class="text-muted small mb-4">Sistema de Gestión Clínica</p>

        {% if form.errors %}
            <div class="alert alert-danger small py-2">Credenciales inválidas.</div>
        {% endif %}

        <form method="POST" class="text-start">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label small fw-bold text-uppercase">Usuario</label>
                <input type="text" name="username" class="form-control" placeholder="admin@keisy.com" required autofocus>
            </div>
            <div class="mb-4">
                <label class="form-label small fw-bold text-uppercase">Contraseña</label>
                <input type="password" name="password" class="form-control" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">Entrar al Sistema</button>
        </form>
        
        <div class="mt-5 pt-3 border-top">
            <small class="text-muted">© 2026 Keisy Medical Control</small>
        </div>
    </div>
</body>
</html>
