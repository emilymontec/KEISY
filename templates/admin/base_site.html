{% extends "admin/base.html" %}

{% block extrastyle %}
{{ block.super }}
<style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap');

    :root {
        --primary: #044b99;      /* Azul Profundo - Confianza */
        --secondary: #0b1a30;    /* Navy */
        --accent: #0697aa;       /* Turquesa */
        --highlight: #dd4496;    /* Magenta */
    }

    #header {
        background: var(--secondary);
        border-bottom: 3px solid var(--primary);
        color: #fff;
        padding: 12px 20px;
    }

    #site-name a,
    #site-name {
        color: #fff;
        font-weight: 700;
        font-size: 1.25rem;
        letter-spacing: -0.02em;
        text-decoration: none;
    }

    div.breadcrumbs {
        background: #f4f8fc;
        color: var(--secondary);
        border-bottom: 1px solid #d4e3f5;
        font-size: 0.85rem;
        padding: 10px 40px;
    }

    div.breadcrumbs a {
        color: var(--primary);
        font-weight: 500;
    }

    .module h2,
    .module caption,
    .inline-group h2 {
        background: var(--secondary);
        color: #fff;
        font-weight: 600;
        padding: 10px 14px;
        border-radius: 8px 8px 0 0;
    }

    .button,
    input[type="submit"],
    input[type="button"],
    .submit-row input,
    a.button {
        background: linear-gradient(135deg, var(--primary), var(--accent)) !important;
        border: none !important;
        border-radius: 8px !important;
        font-weight: 600 !important;
        color: #fff !important;
        padding: 10px 20px !important;
        box-shadow: 0 4px 10px rgba(4, 75, 153, 0.15) !important;
        transition: all 0.2s ease !important;
        cursor: pointer;
    }

    .button:hover,
    input[type="submit"]:hover,
    .submit-row input:hover {
        transform: translateY(-1px) !important;
        box-shadow: 0 6px 14px rgba(4, 75, 153, 0.25) !important;
        opacity: 0.95;
    }

    .button.default,
    input[type="submit"].default,
    .submit-row input.default {
        background: linear-gradient(135deg, var(--primary), var(--highlight)) !important;
    }

    a:link,
    a:visited {
        color: var(--primary);
        font-weight: 500;
        text-decoration: none;
    }

    a:hover {
        color: var(--accent);
    }

    #nav-sidebar .current-app .section:link,
    #nav-sidebar .current-app .section:visited,
    #nav-sidebar .current-model {
        color: var(--primary);
        font-weight: 600;
    }

    .medical-admin-card-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 16px;
        margin: 0 0 24px;
    }

    .medical-admin-card {
        border-radius: 14px;
        padding: 20px;
        color: #fff;
        background: linear-gradient(135deg, var(--primary), var(--accent));
        box-shadow: 0 10px 20px rgba(4, 75, 153, 0.10);
    }

    .medical-admin-card h3 {
        margin: 0 0 6px;
        font-size: 1.1rem;
        font-weight: 700;
    }

    .medical-admin-card p {
        margin: 0;
        font-size: 0.85rem;
        opacity: 0.85;
    }

    .medical-admin-card.secondary {
        background: linear-gradient(135deg, var(--secondary), #152740);
    }

    .medical-admin-card.highlight {
        background: linear-gradient(135deg, var(--accent), var(--teal));
    }

    .medical-login-shell {
        max-width: 440px;
        margin: 60px auto;
        padding: 40px;
        border-radius: 20px;
        background: #fff;
        box-shadow: 0 20px 40px rgba(11, 26, 48, 0.08);
        border: 1px solid #d4e3f5;
    }

    .medical-login-shell h1 {
        color: var(--secondary);
        font-size: 1.6rem;
        font-weight: 700;
        margin-bottom: 8px;
        letter-spacing: -0.02em;
    }

    .medical-login-shell p {
        color: #5c789a;
        font-size: 0.9rem;
        margin-top: 0;
        margin-bottom: 28px;
    }

    #login-form .form-row {
        padding: 8px 0;
        border: none;
    }

    #login-form label {
        font-weight: 600;
        font-size: 0.85rem;
        color: var(--secondary);
        text-transform: uppercase;
        letter-spacing: 0.05em;
        margin-bottom: 6px;
        display: block;
    }

    #login-form input[type="text"],
    #login-form input[type="password"] {
        width: 100%;
        padding: 10px 14px;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        font-size: 14px;
        transition: all 0.2s ease;
    }

    #login-form input[type="text"]:focus,
    #login-form input[type="password"]:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(4, 75, 153, 0.15);
        outline: none;
    }
</style>
{% endblock %}

{% block extrahead %}
{{ block.super }}
<link rel="icon" href="data:,">
{% endblock %}

{% block branding %}
<div id="site-name">
    <a href="{% url 'admin:index' %}">Keisy Medical Control</a>
</div>
{% endblock %}

{% block nav-global %}{% endblock %}
