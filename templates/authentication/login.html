{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keisy Medical | Acceso</title>
    <link rel="icon" href="data:,">
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-dark: #044b99;
            --primary-medium: #0697aa;
            --primary-light: #00abbd;
            --accent-pink: #dd4496;
            --bg-creme: #fcfdfe;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --font-main: 'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif;
        }

        body {
            background-color: var(--bg-creme);
            color: var(--text-main);
            font-family: var(--font-main);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            overflow: hidden;
        }

        .blob-bg {
            position: fixed;
            width: 800px;
            height: 800px;
            background: radial-gradient(circle, rgba(0, 171, 189, 0.1) 0%, rgba(221, 68, 150, 0.05) 50%, rgba(255,255,255,0) 70%);
            z-index: -1;
            border-radius: 43% 57% 70% 30% / 45% 45% 55% 55%;
            animation: wave 25s infinite alternate;
        }

        @keyframes wave {
            0% { border-radius: 43% 57% 70% 30% / 45% 45% 55% 55%; transform: translate(-10%, -10%) rotate(0deg); }
            100% { border-radius: 70% 30% 50% 50% / 30% 60% 40% 70%; transform: translate(10%, 10%) rotate(90deg); }
        }

        .login-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 32px;
            padding: 3.5rem;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 25px 50px -12px rgba(4, 75, 153, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.3);
            position: relative;
            z-index: 1;
        }

        .demo-badge {
            background-color: rgba(6, 151, 170, 0.1);
            color: var(--primary-medium);
            font-size: 0.65rem;
            font-weight: 800;
            padding: 4px 12px;
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: inline-block;
            margin-bottom: 1rem;
        }

        .logo-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            margin-bottom: 1.5rem;
        }

        .logo-img {
            width: 45px;
            height: 45px;
            object-fit: contain;
        }

        .logo-text {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--primary-dark);
            letter-spacing: -1px;
        }
        .logo-text span { color: var(--primary-medium); }

        .form-label {
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin-bottom: 0.75rem;
        }

        .form-control {
            border-radius: 14px;
            padding: 12px 18px;
            border: 1px solid rgba(4, 75, 153, 0.1);
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            border-color: var(--primary-light);
            box-shadow: 0 0 0 4px rgba(0, 171, 189, 0.1);
            outline: none;
        }

        .btn-login {
            background-color: var(--primary-dark);
            color: white;
            border: none;
            border-radius: 14px;
            padding: 14px;
            font-weight: 700;
            width: 100%;
            margin-top: 1rem;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 20px rgba(4, 75, 153, 0.15);
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 25px rgba(4, 75, 153, 0.25);
            background-color: #033d7a;
        }

        .alert-custom {
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: 600;
            border: none;
            background-color: rgba(220, 53, 69, 0.08);
            color: #dc3545;
            padding: 12px;
        }
    </style>
</head>
<body>
    <div class="blob-bg"></div>

    <div class="login-card">
        <div class="text-center">
            <span class="demo-badge">Versión Demo</span>
        </div>
        <div class="logo-container">
            <img src="{% static 'assets/keisy.png' %}" class="logo-img" alt="Keisy Medical">
            <div class="logo-text">Keisy<span>Medical</span></div>
        </div>
        
        <div class="text-center mb-4">
            <h5 class="fw-bold text-primary-dark mb-1">Panel de Control Clínico</h5>
            <p class="text-muted small">Acceso centralizado para personal médico</p>
        </div>

        {% if form.errors %}
            <div class="alert alert-custom mb-4 text-center">
                <span class="me-2">⚠️</span> Credenciales de acceso inválidas.
            </div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label">Usuario</label>
                <input type="text" name="username" class="form-control" placeholder="correo@keisy.com" value="admin@keisy.com" required autofocus>
            </div>
            <div class="mb-4">
                <label class="form-label">Contraseña</label>
                <input type="password" name="password" class="form-control" placeholder="••••••••" value="admin123" required>
            </div>
            <button type="submit" class="btn-login">Entrar al Sistema</button>
        </form>
        
        <div class="mt-5 pt-4 border-top text-center">
            <p class="text-muted small mb-0">© 2026 Ecosistema de Salud Digital</p>
        </div>
    </div>
</body>
</html>
